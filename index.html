<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DR Music Records</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="container mt-4">
        <h1 class="mb-4">DR Music Records</h1>

        <div v-if="loading" class="text-center my-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div v-else-if="error" class="alert alert-danger" id="error-message">
            {{ error }}
        </div>

        <div v-else>
            <p class="text-muted">{{ records.length }} record(s) found.</p>
            <table class="table table-striped table-hover" id="records-table">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Duration</th>
                        <th>Year</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="record in records" :key="record.id" class="record-row">
                        <td class="record-title">{{ record.title }}</td>
                        <td class="record-artist">{{ record.artist }}</td>
                        <td>{{ formatDuration(record.duration) }}</td>
                        <td>{{ record.publicationYear }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
